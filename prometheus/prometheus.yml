global:
  # 30s, not 5s. Five-second scraping is a development setting: on a shared
  # box serving a handful of people a day it writes six times the samples for
  # detail nobody looks at, and Prometheus's disk is the scarce thing here.
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: 'fastapi'
    static_configs:
      - targets: ['app:8000']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
