# VA platform, as it runs on the shared server.
#
# Two things changed when this moved onto a box with four other projects.
#
# **There is no Caddy here any more.** One Caddy sits in front of everything on
# the server and routes by hostname; a second one inside this stack would mean
# two places routing lives, and eventually they disagree. This app joins the
# shared `edge` network and the front Caddy reaches it by name.
#
# **Nothing opens a port on the server.** Not the database, not Redis, and no
# longer Grafana — which was published on 0.0.0.0:3000 with the password from
# this file's own defaults. On a public IP that is an open dashboard. Grafana
# and Prometheus are now reachable only over Tailscale.

name: va-platform

services:
  app:
    image: ghcr.io/shareeq-acc/va-platform:${IMAGE_TAG:-latest}
    # Fixed, because the front Caddy addresses this by name. Without it the
    # name is derived from the folder and changes if the folder is renamed.
    container_name: va-app
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - ENV=${ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://va-redis:6379/0
      - VAPI_API_KEY=${VAPI_API_KEY}
      - VAPI_ASSISTANT_ID=${VAPI_ASSISTANT_ID}
      - VAPI_PHONE_NUMBER_ID=${VAPI_PHONE_NUMBER_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GRAFANA_URL=${GRAFANA_URL}
    depends_on:
      db:
        condition: service_healthy
      va-redis:
        condition: service_started
    networks:
      - default
      - edge
    mem_limit: 512m

  arq_worker:
    image: ghcr.io/shareeq-acc/va-platform:${IMAGE_TAG:-latest}
    restart: always
    command: arq app.tasks.worker.WorkerSettings
    environment:
      - ENV=${ENV}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://va-redis:6379/0
      - VAPI_API_KEY=${VAPI_API_KEY}
      - VAPI_ASSISTANT_ID=${VAPI_ASSISTANT_ID}
      - VAPI_PHONE_NUMBER_ID=${VAPI_PHONE_NUMBER_ID}
      - APP_HEALTH_URL=http://app:8000/healthz
    depends_on:
      - app
      - va-redis
    mem_limit: 384m

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:?set DB_USER in .env}
      # Refuse to start rather than inherit a blank or a copied-through
      # default. Postgres itself would fail on an empty password, but with a
      # message about initialisation that sends you looking at the volume.
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - POSTGRES_DB=${DB_NAME:?set DB_NAME in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 384m

  va-redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    mem_limit: 128m

  redis_exporter:
    image: oliver006/redis_exporter:latest
    restart: always
    environment:
      - REDIS_ADDR=redis://va-redis:6379
    depends_on:
      - va-redis
    mem_limit: 64m

  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      # Left unbounded, this uses whatever disk it is given, and a full disk
      # stops Postgres before it stops anything you would notice.
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=3GB'
    depends_on:
      - app
      - redis_exporter
    mem_limit: 512m

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      # Loopback only. Tailscale serves this to you; it is not on the internet.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      # No defaults. `admin` / `admin_secret` was the default here, and a
      # default password is the one that is still set a year later.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
  # Created once on the server with `docker network create edge`. Shared with
  # the other projects so the front Caddy can reach this app by name.
  edge:
    external: true
